name: Build & Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Build Universal DMG
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build and package DMG
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          ./scripts/make-dmg.sh "$VERSION"
          echo "DMG_NAME=dist/MusicPlayerMenubar-${VERSION}-universal.dmg" >> $GITHUB_ENV

      - name: Verify entitlements
        run: |
          APP=".dmgbuild/Build/Products/Release/MusicPlayerMenubar.app"
          ENTS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -convert xml1 -o - -)
          echo "$ENTS"
          # The local-only product must ship without network capability.
          if echo "$ENTS" | grep -q "com.apple.security.network.client"; then
            echo "::error::local-only build carries a network entitlement"
            exit 1
          fi
          echo "confirmed: no network entitlement"

      - name: Upload DMG to Release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ env.DMG_NAME }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
